<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing accent border -->
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Radar / Calling target concentric circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#6366f1" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="135" fill="none" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.35"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.45"/>

  <!-- Center Hex/Shield Badge -->
  <rect x="146" y="146" width="220" height="220" rx="44" fill="url(#primaryGrad)" filter="url(#glow)"/>

  <!-- Phone Handset Silhouette & Call Pulse -->
  <g transform="translate(186, 186) scale(0.273)" fill="#ffffff">
    <!-- Lucide-style Phone Call Vector -->
    <path d="M120 40 C140 40 160 55 170 80 L200 150 C210 170 200 195 185 210 L150 245 C180 310 230 360 295 390 L330 355 C345 340 370 330 390 340 L460 370 C485 380 500 400 500 420 L500 480 C500 515 470 545 435 540 C210 515 35 335 10 110 C5 75 35 45 70 40 Z" />
  </g>

  <!-- Target Center Pulse & Lightning/Speed Pip -->
  <circle cx="360" cy="155" r="32" fill="url(#accentGrad)" filter="url(#glow)"/>
  <polygon points="360,135 348,157 360,157 356,175 374,151 363,151" fill="#1e1b4b"/>

  <!-- Active Status Green Beacon -->
  <circle cx="155" cy="360" r="22" fill="url(#emeraldGrad)" filter="url(#glow)"/>
  <circle cx="155" cy="360" r="10" fill="#ffffff"/>
</svg>
